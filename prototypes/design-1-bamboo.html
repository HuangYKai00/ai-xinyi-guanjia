<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 心意管家 · 青篆年历</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
:root {
  --canvas: #dde4d8;
  --surface: #f7f8f2;
  --surface-deep: #eaf0e6;
  --ink: #1b271f;
  --muted: #627067;
  --line: #c5d0c3;
  --bamboo: #2e6a4b;
  --bamboo-soft: #d8e6d6;
  --seal: #a43b34;
  --white: #fffef9;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  min-height: 100vh;
  background: var(--canvas);
  color: var(--ink);
  font-family: "Noto Serif SC", "Songti SC", STSong, serif;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; }
button:focus-visible { outline: 2px solid var(--seal); outline-offset: 3px; }
.app {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  max-width: 1440px;
  margin: 0 auto;
  background: var(--surface);
  box-shadow: 0 0 0 1px rgba(27,39,31,.08);
}
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 24px;
  padding: 28px clamp(20px, 5vw, 68px) 20px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.brand { display: flex; align-items: baseline; gap: 14px; }
.brand h1 { margin: 0; font: 32px "ZCOOL XiaoWei", "Noto Serif SC", serif; letter-spacing: .08em; }
.brand small { color: var(--muted); font-size: 12px; letter-spacing: .14em; }
.date-mark { color: var(--muted); font-size: 12px; text-align: right; line-height: 1.7; }
.date-mark strong { color: var(--bamboo); display: block; font-size: 15px; font-weight: 600; }
.main { flex: 1; min-height: 0; overflow: auto; padding: 30px clamp(20px, 5vw, 68px) 44px; }
.panel[hidden] { display: none; }
.panel-head { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 26px; }
.panel-title { margin: 0; font: 42px "ZCOOL XiaoWei", "Noto Serif SC", serif; letter-spacing: .06em; }
.panel-kicker { margin: 0 0 6px; color: var(--muted); font-size: 12px; letter-spacing: .12em; }
.panel-note { color: var(--muted); font-size: 13px; line-height: 1.7; max-width: 420px; text-align: right; }
.rule-heading {
  display: flex; align-items: center; gap: 12px; margin: 30px 0 10px;
  color: var(--muted); font-size: 12px; letter-spacing: .16em;
}
.rule-heading::after { content: ""; height: 1px; flex: 1; background: var(--line); }
.reminder-layout { display: grid; grid-template-columns: minmax(190px, .7fr) minmax(0, 2fr); gap: clamp(26px, 6vw, 92px); align-items: start; }
.focus-date { border-left: 3px solid var(--seal); padding: 18px 0 18px 20px; }
.focus-date .eyebrow { color: var(--seal); font-size: 12px; letter-spacing: .13em; }
.focus-date .number { margin: 14px 0 5px; font: 86px/.84 "ZCOOL XiaoWei", "Noto Serif SC", serif; color: var(--bamboo); }
.focus-date .unit { color: var(--muted); font-size: 14px; }
.focus-date p { max-width: 180px; margin: 22px 0 0; color: var(--muted); font-size: 13px; line-height: 1.8; }
.sortbar { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 10px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.sortbar span { color: var(--muted); font-size: 12px; }
.sorts { display: flex; gap: 4px; }
.sort-btn { min-height: 38px; padding: 6px 12px; border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer; font-size: 12px; }
.sort-btn[aria-pressed="true"] { border-color: var(--bamboo); color: var(--bamboo); background: var(--bamboo-soft); }
.reminder-row {
  display: grid; grid-template-columns: 84px minmax(0, 1fr) auto;
  gap: 16px; align-items: center; min-height: 92px;
  border-bottom: 1px solid var(--line); padding: 14px 0;
}
.reminder-row.is-disabled { color: var(--muted); opacity: .55; }
.reminder-row.is-expired { background: var(--surface-deep); padding-inline: 12px; }
.row-date { color: var(--muted); font-size: 12px; line-height: 1.55; }
.row-date strong { display: block; color: var(--ink); font-size: 18px; font-weight: 600; }
.row-name { font-size: 17px; font-weight: 600; }
.row-meta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 5px; color: var(--muted); font-size: 12px; }
.row-meta .kind { color: var(--bamboo); }
.row-meta .holiday { color: var(--seal); }
.row-status { text-align: right; white-space: nowrap; }
.row-status strong { display: block; color: var(--seal); font: 28px/1 "ZCOOL XiaoWei", "Noto Serif SC", serif; }
.row-status small { color: var(--muted); font-size: 11px; }
.row-status.expired strong { color: var(--muted); font: 14px "Noto Serif SC", serif; }
.toggle {
  width: 44px; height: 26px; position: relative; border: 1px solid var(--bamboo); background: var(--bamboo);
  cursor: pointer; margin-top: 9px;
}
.toggle::after { content: ""; position: absolute; width: 18px; height: 18px; top: 3px; left: 3px; background: var(--white); transition: transform .18s ease; }
.toggle[aria-checked="false"] { border-color: var(--line); background: var(--line); }
.toggle[aria-checked="false"]::after { transform: translateX(18px); background: var(--surface); }
.toggle-label { display: block; color: var(--muted); font-size: 10px; margin-top: 4px; }
.group-title { margin: 18px 0 0; color: var(--bamboo); font-size: 14px; font-weight: 600; }
.directory {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  border-top: 1px solid var(--line); border-left: 1px solid var(--line);
}
.person {
  min-height: 190px; padding: 20px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  background: var(--surface); position: relative;
}
.person:nth-child(4n+1) { background: var(--surface-deep); }
.person-index { color: var(--seal); font: 42px/.8 "ZCOOL XiaoWei", "Noto Serif SC", serif; float: right; }
.person h2 { margin: 0 0 4px; font-size: 22px; font-weight: 600; }
.person .relationship { color: var(--muted); font-size: 12px; }
.person .traits { margin: 20px 0 16px; color: var(--muted); font-size: 12px; line-height: 1.75; }
.person-days { display: flex; flex-direction: column; gap: 7px; border-top: 1px solid var(--line); padding-top: 12px; }
.person-day { display: flex; justify-content: space-between; gap: 10px; color: var(--ink); font-size: 12px; }
.person-day span:last-child { color: var(--muted); white-space: nowrap; }
.source { display: inline-block; margin-left: 5px; color: var(--bamboo); font-size: 10px; }
.source.auto { color: var(--seal); }
.history-grid { display: grid; grid-template-columns: 130px minmax(0, 1fr); border-top: 1px solid var(--line); }
.month { padding: 18px 16px 0 0; color: var(--bamboo); font: 28px "ZCOOL XiaoWei", "Noto Serif SC", serif; border-bottom: 1px solid var(--line); }
.month-items { border-left: 1px solid var(--line); }
.history-row { display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; gap: 18px; align-items: center; min-height: 80px; padding: 14px 0 14px 20px; border-bottom: 1px solid var(--line); }
.history-date { color: var(--muted); font-size: 12px; }
.history-name { font-size: 16px; font-weight: 600; }
.history-sub { margin-top: 4px; color: var(--muted); font-size: 12px; }
.history-state { color: var(--bamboo); font-size: 11px; white-space: nowrap; }
.history-state.closed { color: var(--seal); }
.bottom-nav { display: flex; border-top: 1px solid var(--line); background: var(--surface); padding: 0 clamp(20px, 5vw, 68px) env(safe-area-inset-bottom); }
.tab { position: relative; flex: 1; min-height: 64px; border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; font-size: 13px; }
.tab:first-child { border-left: 1px solid var(--line); }
.tab[aria-selected="true"] { color: var(--bamboo); background: var(--bamboo-soft); font-weight: 600; }
.tab[aria-selected="true"]::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--seal); }
@media (max-width: 720px) {
  .topbar { align-items: flex-start; padding-top: 20px; }
  .brand { display: block; }
  .brand small { display: block; margin-top: 6px; }
  .brand h1 { font-size: 27px; }
  .date-mark { font-size: 11px; }
  .main { padding-top: 22px; }
  .panel-head { display: block; }
  .panel-title { font-size: 36px; }
  .panel-note { margin-top: 10px; text-align: left; }
  .reminder-layout { grid-template-columns: 1fr; gap: 18px; }
  .focus-date { padding-block: 12px; }
  .focus-date .number { display: inline-block; margin: 10px 12px 0 0; font-size: 66px; }
  .focus-date p { display: inline-block; vertical-align: top; margin-top: 18px; }
  .directory { grid-template-columns: 1fr; }
  .history-grid { grid-template-columns: 72px minmax(0, 1fr); }
  .month { font-size: 22px; }
  .history-row { grid-template-columns: 78px minmax(0, 1fr); gap: 10px; padding-left: 12px; }
  .history-state { grid-column: 2; }
}
@media (max-width: 420px) {
  .topbar { padding-inline: 16px; }
  .main { padding-inline: 16px; }
  .bottom-nav { padding-inline: 16px; }
  .date-mark { display: none; }
  .reminder-row { grid-template-columns: 68px minmax(0, 1fr) auto; gap: 10px; }
  .row-name { font-size: 15px; }
  .row-status strong { font-size: 23px; }
  .toggle { width: 40px; }
  .toggle[aria-checked="false"]::after { transform: translateX(14px); }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><h1>心意管家</h1><small>青篆年历 · 方案一</small></div>
    <div class="date-mark"><strong>2026 年 4 月 27 日</strong>把值得记得的日子，排在眼前</div>
  </header>
  <main class="main">
    <section class="panel" id="panel-reminder" role="tabpanel" aria-labelledby="tab-reminder">
      <div class="panel-head"><div><p class="panel-kicker">每一笔，都是一份记挂</p><h2 class="panel-title">提醒</h2></div><p class="panel-note">生日、纪念日与尚未关联的节日都在同一本年历里。切换查看方式，按时间或按联系人整理。</p></div>
      <div class="reminder-layout"><aside class="focus-date"><span class="eyebrow">最近的一笔</span><div class="number">3</div><span class="unit">天后 · 4 月 30 日</span><p>妈妈的生日临近了。还有时间准备一份合适的心意。</p></aside><div><div class="sortbar"><span>查看方式</span><div class="sorts"><button class="sort-btn" type="button" data-sort="days" aria-pressed="true">按剩余天数</button><button class="sort-btn" type="button" data-sort="contact" aria-pressed="false">按联系人</button></div></div><div id="reminder-list"></div></div></div>
    </section>
    <section class="panel" id="panel-contact" role="tabpanel" aria-labelledby="tab-contact" hidden>
      <div class="panel-head"><div><p class="panel-kicker">把重要的人安放在一处</p><h2 class="panel-title">联系人</h2></div><p class="panel-note">列表展示每个人最近的日子；手动设定与身份自动关联的日子，用小字标记区分。</p></div>
      <div class="directory" id="contact-list"></div>
    </section>
    <section class="panel" id="panel-history" role="tabpanel" aria-labelledby="tab-history" hidden>
      <div class="panel-head"><div><p class="panel-kicker">已经发生过的心意</p><h2 class="panel-title">历史</h2></div><p class="panel-note">按提醒日归档。这里记录发生过的日子，不标注提醒周期。</p></div>
      <div class="history-grid" id="history-list"></div>
    </section>
  </main>
  <nav class="bottom-nav" aria-label="主导航" role="tablist">
    <button class="tab" id="tab-reminder" type="button" role="tab" aria-selected="true" aria-controls="panel-reminder" data-tab="reminder">提醒</button>
    <button class="tab" id="tab-contact" type="button" role="tab" aria-selected="false" aria-controls="panel-contact" data-tab="contact">联系人</button>
    <button class="tab" id="tab-history" type="button" role="tab" aria-selected="false" aria-controls="panel-history" data-tab="history">历史</button>
  </nav>
</div>
<script>
const prototypeData = {
  contacts: [
    { id: 'mom', name: '妈妈', relationship: '母亲', traits: '爱养花，今年刚退休', index: '母', days: [{ name: '生日', date: '2026-04-30', daysRemaining: 3, source: '手动' }, { name: '母亲节', date: '2026-05-10', daysRemaining: 13, source: '自动关联' }] },
    { id: 'wife', name: '妻子', relationship: '妻子', traits: '喜欢烘焙和旅行', index: '妻', days: [{ name: '结婚纪念日', date: '2026-05-04', daysRemaining: 7, source: '手动' }, { name: '妇女节', date: '2027-03-08', daysRemaining: 315, source: '自动关联' }] },
    { id: 'dad', name: '爸爸', relationship: '父亲', traits: '退休教师，爱下棋钓鱼', index: '父', days: [{ name: '父亲节', date: '2026-06-21', daysRemaining: 55, source: '自动关联' }] },
    { id: 'daughter', name: '女儿小月', relationship: '女儿', traits: '小学三年级，学钢琴', index: '月', days: [{ name: '生日', date: '2026-08-25', daysRemaining: 120, source: '手动' }] },
    { id: 'li', name: '老同学李明', relationship: '大学室友', traits: '爱打篮球，程序猿', index: '李', days: [{ name: '生日', date: '2026-06-11', daysRemaining: 45, source: '手动' }] }
  ],
  reminders: [
    { id: 'r1', contactId: 'mom', displayName: '妈妈', relationship: '母亲', dayName: '生日', dayType: '生日', date: '2026-04-30', daysRemaining: 3, enabled: true, expired: false },
    { id: 'r2', contactId: 'wife', displayName: '妻子', relationship: '妻子', dayName: '结婚纪念日', dayType: '纪念日', date: '2026-05-04', daysRemaining: 7, enabled: true, expired: false },
    { id: 'r3', contactId: 'mom', displayName: '妈妈', relationship: '母亲', dayName: '母亲节', dayType: '节日', date: '2026-05-10', daysRemaining: 13, enabled: true, expired: false },
    { id: 'r4', contactId: 'holiday', displayName: '端午节', relationship: '未关联联系人', dayName: '端午节', dayType: '纯节日', date: '2026-06-19', daysRemaining: 53, enabled: true, expired: false, holiday: true },
    { id: 'r5', contactId: 'dad', displayName: '爸爸', relationship: '父亲', dayName: '父亲节', dayType: '节日', date: '2026-06-21', daysRemaining: 55, enabled: true, expired: false },
    { id: 'r6', contactId: 'li', displayName: '老同学李明', relationship: '大学室友', dayName: '生日', dayType: '生日', date: '2026-06-11', daysRemaining: 45, enabled: false, expired: false },
    { id: 'r7', contactId: 'daughter', displayName: '女儿小月', relationship: '女儿', dayName: '儿童节', dayType: '节日', date: '2026-04-10', daysRemaining: null, enabled: false, expired: true },
    { id: 'r8', contactId: 'old-colleague', displayName: '老王', relationship: '前同事', dayName: '入职纪念日', dayType: '纪念日', date: '2026-03-20', daysRemaining: null, enabled: false, expired: true }
  ],
  history: [
    { date: '2026-04-20', name: '邻居张阿姨', relationship: '邻居', dayName: '妇女节', month: '2026 年 4 月', contentState: 'closed' },
    { date: '2026-03-15', name: '爸爸', relationship: '父亲', dayName: '生日', month: '2026 年 3 月', contentState: 'saved' },
    { date: '2026-02-14', name: '妻子', relationship: '妻子', dayName: '情人节', month: '2026 年 2 月', contentState: 'saved' },
    { date: '2026-01-18', name: '妈妈', relationship: '母亲', dayName: '生日', month: '2026 年 1 月', contentState: 'saved' },
    { date: '2025-12-25', name: '老王', relationship: '前同事', dayName: '入职纪念日', month: '2025 年 12 月', contentState: 'saved' }
  ]
};
let sortMode = 'days';
const formatDate = value => { const [, month, day] = value.split('-'); return `${month} 月 ${day} 日`; };
const reminderRow = item => `<article class="reminder-row ${item.enabled ? '' : 'is-disabled'} ${item.expired ? 'is-expired' : ''}"><div class="row-date"><strong>${formatDate(item.date)}</strong>${item.expired ? '已过提醒日' : '日子日期'}</div><div><div class="row-name">${item.displayName}</div><div class="row-meta"><span class="kind ${item.holiday ? 'holiday' : ''}">${item.dayName}</span><span>${item.relationship}</span>${!item.expired && !item.enabled ? '<span>提醒已关闭</span>' : ''}</div></div><div class="row-status ${item.expired ? 'expired' : ''}">${item.expired ? '<strong>已过期</strong>' : `<strong>${item.daysRemaining}</strong><small>天后</small><button class="toggle" type="button" role="switch" aria-label="${item.displayName}的${item.dayName}提醒" aria-checked="${item.enabled}"></button><span class="toggle-label">${item.enabled ? '提醒开启' : '提醒关闭'}</span>`}</div></article>`;
function renderReminders() {
  const active = prototypeData.reminders.filter(item => !item.expired);
  const expired = prototypeData.reminders.filter(item => item.expired);
  let html = '<div class="rule-heading">生效中</div>';
  if (sortMode === 'days') {
    active.sort((a, b) => a.daysRemaining - b.daysRemaining).forEach(item => { html += reminderRow(item); });
  } else {
    const groups = new Map();
    active.forEach(item => { const key = item.contactId === 'holiday' ? '节日' : item.displayName; if (!groups.has(key)) groups.set(key, []); groups.get(key).push(item); });
    [...groups.entries()].sort(([a], [b]) => a === '节日' ? 1 : b === '节日' ? -1 : a.localeCompare(b, 'zh')).forEach(([name, items]) => { html += `<h3 class="group-title">${name}</h3>`; items.sort((a, b) => a.daysRemaining - b.daysRemaining).forEach(item => { html += reminderRow(item); }); });
  }
  html += '<div class="rule-heading">已过期</div>';
  expired.forEach(item => { html += reminderRow(item); });
  document.getElementById('reminder-list').innerHTML = html;
}
function renderContacts() {
  document.getElementById('contact-list').innerHTML = prototypeData.contacts.map(person => `<article class="person"><span class="person-index">${person.index}</span><h2>${person.name}</h2><div class="relationship">${person.relationship}</div><p class="traits">${person.traits}</p><div class="person-days">${person.days.map(day => `<div class="person-day"><span>${day.name}<small class="source ${day.source === '自动关联' ? 'auto' : ''}">${day.source}</small></span><span>${formatDate(day.date)} · ${day.daysRemaining} 天后</span></div>`).join('')}</div></article>`).join('');
}
function renderHistory() {
  const months = [...new Set(prototypeData.history.map(item => item.month))];
  document.getElementById('history-list').innerHTML = months.map(month => `<div class="month">${month}</div><div class="month-items">${prototypeData.history.filter(item => item.month === month).map(item => `<article class="history-row"><div class="history-date">${formatDate(item.date)}</div><div><div class="history-name">${item.name}</div><div class="history-sub">${item.relationship} · ${item.dayName}</div></div><div class="history-state ${item.contentState === 'closed' ? 'closed' : ''}">${item.contentState === 'closed' ? '内容未生成 · 提醒已关闭' : '内容已保存'}</div></article>`).join('')}</div>`).join('');
}
function selectTab(target) {
  document.querySelectorAll('[role="tab"]').forEach(tab => tab.setAttribute('aria-selected', String(tab.dataset.tab === target)));
  document.querySelectorAll('.panel').forEach(panel => { panel.hidden = panel.id !== `panel-${target}`; });
}
document.querySelectorAll('[role="tab"]').forEach(tab => tab.addEventListener('click', () => selectTab(tab.dataset.tab)));
document.querySelectorAll('[data-sort]').forEach(button => button.addEventListener('click', () => { sortMode = button.dataset.sort; document.querySelectorAll('[data-sort]').forEach(item => item.setAttribute('aria-pressed', String(item === button))); renderReminders(); }));
document.addEventListener('click', event => { const toggle = event.target.closest('.toggle'); if (!toggle) return; const enabled = toggle.getAttribute('aria-checked') === 'true'; const item = prototypeData.reminders.find(reminder => `${reminder.displayName}的${reminder.dayName}提醒` === toggle.getAttribute('aria-label')); if (item) item.enabled = !enabled; renderReminders(); });
renderReminders(); renderContacts(); renderHistory();
</script>
</body>
</html>
