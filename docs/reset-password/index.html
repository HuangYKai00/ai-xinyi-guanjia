<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>重置密码 · AI 心意管家</title>
<style>
  :root {
    --ink: #202B28;
    --ink-soft: #53625C;
    --jade: #1F5B52;
    --jade-dark: #123F3A;
    --lacquer: #A13C32;
    --gold: #AD8137;
    --paper: #F5F0E6;
    --white: #FFFDF8;
    --line: #D9D0C0;
    --muted: #89938D;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 20px 56px;
  }
  main { width: 100%; max-width: 420px; }
  .seal {
    width: 48px; height: 48px;
    border: 1px solid var(--lacquer);
    color: var(--lacquer);
    font-family: Georgia, "Songti SC", serif;
    font-size: 21px;
    display: flex; align-items: center; justify-content: center;
    transform: rotate(-4deg);
  }
  .eyebrow {
    margin: 22px 0 0;
    color: var(--gold);
    font-size: 11px;
    letter-spacing: 2px;
  }
  h1 {
    margin: 5px 0 0;
    font-family: Georgia, "Songti SC", serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--jade-dark);
    line-height: 1.3;
  }
  .desc { margin: 7px 0 0; color: var(--ink-soft); font-size: 13px; line-height: 1.6; }
  hr { border: 0; border-top: 1px solid var(--jade); margin: 22px 0 0; }
  .card {
    margin-top: 20px;
    background: var(--white);
    border: 1px solid var(--line);
    padding: 18px 17px;
  }
  label {
    display: block;
    font-family: Georgia, "Songti SC", serif;
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 7px;
  }
  .field { margin-bottom: 18px; }
  input {
    width: 100%;
    border: 0;
    border-bottom: 1px solid var(--jade);
    background: transparent;
    color: var(--ink);
    font-size: 14px;
    font-family: inherit;
    padding: 8px 3px;
    min-height: 42px;
    outline: none;
  }
  input:focus { border-bottom-color: var(--jade-dark); }
  button {
    width: 100%;
    min-height: 48px;
    margin-top: 8px;
    border: 0;
    background: var(--jade);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }
  button:disabled { opacity: 0.55; cursor: default; }
  .ghost {
    background: transparent;
    color: var(--jade);
    border: 1px solid var(--jade);
    font-weight: 400;
  }
  .msg {
    font-size: 12px;
    line-height: 1.6;
    margin: 0 0 12px;
    padding: 9px 11px;
    border-left: 3px solid var(--jade);
    background: #EFF4F0;
    color: var(--jade-dark);
  }
  .msg.error { border-left-color: var(--lacquer); background: #FBF0ED; color: var(--lacquer); }
  .msg.warn { border-left-color: var(--gold); background: #FAF3E6; color: #7A5A21; }
  .hint { color: var(--muted); font-size: 10px; line-height: 1.6; margin: 6px 0 0; }
  .title-lg {
    font-family: Georgia, "Songti SC", serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--jade-dark);
    line-height: 1.5;
    margin: 0 0 9px;
  }
  .note { color: var(--ink-soft); font-size: 12px; line-height: 1.7; margin: 0 0 16px; }
  .hidden { display: none !important; }
  footer { margin-top: 22px; color: var(--muted); font-size: 10px; line-height: 1.7; }
</style>
</head>
<body>
<main>
  <div class="seal">心</div>
  <p class="eyebrow" id="eyebrow">账号 · 重置密码</p>
  <h1 id="heading">设置新密码</h1>
  <p class="desc" id="subtitle">正在校验重置链接…</p>
  <hr />

  <div class="card">
    <p class="msg error hidden" id="errorBox"></p>

    <!-- 校验中 -->
    <div id="viewLoading">
      <p class="note">正在校验你的重置链接，请稍候。</p>
    </div>

    <!-- 设置新密码表单 -->
    <form id="viewForm" class="hidden" novalidate>
      <div class="field">
        <label for="password">新密码</label>
        <input id="password" type="password" autocomplete="new-password" placeholder="至少 8 位" />
      </div>
      <div class="field">
        <label for="confirm">确认密码</label>
        <input id="confirm" type="password" autocomplete="new-password" placeholder="再次输入新密码" />
      </div>
      <p class="hint">密码不少于 8 位，两次输入需一致。</p>
      <button type="submit" id="submitBtn">确认重置</button>
    </form>

    <!-- 成功 -->
    <div id="viewSuccess" class="hidden">
      <p class="title-lg">密码已重置</p>
      <p class="note">请回到 AI 心意管家 App，使用新密码重新登录。App 不会因为你重置密码而自动登录。</p>
      <button type="button" id="openAppBtn">返回 App</button>
    </div>

    <!-- 链接失效 -->
    <div id="viewInvalid" class="hidden">
      <p class="title-lg">重置链接已失效</p>
      <p class="note">链接可能已过期或被使用过。请回到 App 的登录页，点击「忘记密码？」重新发送一封重置邮件。</p>
    </div>
  </div>

  <footer>本页面由公网静态托管，仅用于承接重置密码邮件中的链接。</footer>
</main>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://vfrezkbmfsjqxztynmwl.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_XZ4Kc7nbORfQs7W2gJldkA_YCSIGVTu';
const APP_SCHEME = 'aiheartkeeper://';

const views = {
  loading: document.getElementById('viewLoading'),
  form: document.getElementById('viewForm'),
  success: document.getElementById('viewSuccess'),
  invalid: document.getElementById('viewInvalid'),
};
const errorBox = document.getElementById('errorBox');
const eyebrow = document.getElementById('eyebrow');
const heading = document.getElementById('heading');
const subtitle = document.getElementById('subtitle');

function show(name, text) {
  Object.entries(views).forEach(([key, el]) => el.classList.toggle('hidden', key !== name));
  if (text) [eyebrow.textContent, heading.textContent, subtitle.textContent] = text;
}

function showError(message) {
  errorBox.textContent = message;
  errorBox.classList.remove('hidden');
}
function clearError() {
  errorBox.textContent = '';
  errorBox.classList.add('hidden');
}

// 凭证必须先抓下来、再清理地址栏 —— 顺序不能反，否则 token 丢失。
// 默认 implicit flow 把 access_token / refresh_token 放在 URL hash 上；
// 这里同时兼容 PKCE 的 ?code= 与自定义模板的 token_hash，不依赖具体配置。
const rawParams = new URLSearchParams(
  (window.location.hash.startsWith('#') ? window.location.hash.slice(1) : '') ||
    (window.location.search.startsWith('?') ? window.location.search.slice(1) : ''),
);
const accessToken = rawParams.get('access_token');
const refreshToken = rawParams.get('refresh_token');
const authCode = rawParams.get('code');
const tokenHash = rawParams.get('token_hash');
const otpType = rawParams.get('type');
const hasToken = Boolean((accessToken && refreshToken) || authCode || (tokenHash && otpType));

// 清理地址栏，避免凭证留在浏览器历史或截图里
if (window.location.hash || window.location.search) {
  history.replaceState(null, '', window.location.pathname);
}

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { detectSessionInUrl: false, persistSession: true, autoRefreshToken: false },
});

function showForm() {
  show('form', ['账号 · 重置密码', '设置新密码', '重置链接已校验通过，请设置一个新的登录密码。']);
}

// 用链接里的凭证建立会话，成功返回 true
async function establishSessionFromLink() {
  if (accessToken && refreshToken) {
    const { error } = await supabase.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
    if (!error) return true;
  }
  if (authCode) {
    const { error } = await supabase.auth.exchangeCodeForSession(authCode);
    if (!error) return true;
  }
  if (tokenHash && otpType) {
    const { error } = await supabase.auth.verifyOtp({ token_hash: tokenHash, type: otpType });
    if (!error) return true;
  }
  return false;
}

try {
  if (hasToken) {
    // 链接带了凭证：只认这份凭证，避免误改当前浏览器里已登录的其他账号
    (await establishSessionFromLink()) ? showForm() : show('invalid');
  } else {
    // 链接没带凭证：可能已登录用户直接打开，也可能是失效链接
    const { data } = await supabase.auth.getSession();
    data.session ? showForm() : show('invalid');
  }
} catch {
  show('invalid');
}

document.getElementById('submitBtn').addEventListener('click', async (event) => {
  event.preventDefault();
  clearError();
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;

  if (password.length < 8) return showError('密码至少需要 8 位。');
  if (password !== confirm) return showError('两次输入的密码不一致。');

  const button = document.getElementById('submitBtn');
  button.disabled = true;
  button.textContent = '正在重置…';

  const { error } = await supabase.auth.updateUser({ password });

  if (error) {
    button.disabled = false;
    button.textContent = '确认重置';
    const message = (error.message || '').toLowerCase();
    if (message.includes('failed to fetch') || message.includes('network')) {
      showError('网络连接异常，请检查网络后重试。');
    } else if (message.includes('expired') || message.includes('invalid')) {
      show('invalid');
    } else {
      showError('重置失败，请稍后重试，或回到 App 重新发送重置邮件。');
    }
    return;
  }

  await supabase.auth.signOut().catch(() => {});
  show('success');
});

document.getElementById('openAppBtn').addEventListener('click', () => {
  window.location.href = APP_SCHEME;
});
</script>
</body>
</html>
